<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — GGHI HR Portal</title>
    <style>
        *,::before,::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#f1f5f9}
        .center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:1.5rem;padding:2rem;text-align:center}
        svg{color:#4f46e5;width:4rem;height:4rem}
        h1{font-size:1.5rem;font-weight:600}
        p{color:#94a3b8;font-size:.875rem;max-width:24rem;line-height:1.6}
        button{margin-top:.5rem;padding:.625rem 1.5rem;background:#4f46e5;color:#fff;border:none;border-radius:.75rem;font-size:.875rem;font-weight:500;cursor:pointer}
        button:hover{background:#4338ca}
    </style>
</head>
<body>
    <div class="center">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 01-1.125-1.125M3.375 19.5h1.5C5.496 19.5 6 18.996 6 18.375m-3.75.125v-5.25c0-.621.504-1.125 1.125-1.125H18.75m-16.5 6v-5.25m16.5 5.25h-1.5A1.125 1.125 0 0118 18.375m1.5 1.125v-5.25c0-.621-.504-1.125-1.125-1.125H5.25m13.5 5.25H5.25m0 0A1.125 1.125 0 014.125 13.5v-5.25c0-.621.504-1.125 1.125-1.125h13.5c.621 0 1.125.504 1.125 1.125v5.25c0 .621-.504 1.125-1.125 1.125H5.25z"/>
        </svg>
        <h1>You're offline</h1>
        <p>No internet connection. Please check your network and try again.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>

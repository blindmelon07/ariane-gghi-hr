; Copy this file to config.ini (same folder) and fill in your real values.
; config.ini is gitignored on purpose — it holds a secret token, never commit it.

[device]
; IP address of the ZKTeco biometric device on your office LAN.
ip = 192.168.1.201
port = 4370
; Most devices have no password set (0). Only change this if yours does.
password = 0
; Leave false unless your device specifically requires UDP instead of TCP.
force_udp = false
timeout_seconds = 10

[server]
; The GGHI HR Portal's base URL — no trailing slash, no /api suffix.
; Local dev example:   http://127.0.0.1:8000
; Hosted example:       https://hr.yourcompany.com
base_url = http://127.0.0.1:8000

; Must match the server's SYNC_API_TOKEN (see the app's .env file).
; Generate one with: php -r "echo bin2hex(random_bytes(32));"
api_token = REPLACE_WITH_THE_SERVER_SYNC_API_TOKEN

; Set to false only if the server uses a self-signed HTTPS certificate you
; trust. Leave true otherwise — disabling this weakens security.
verify_ssl = true
